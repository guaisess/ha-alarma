# Versión 2026.11.12
# Compila la app como paquete AAB firmado para Google Play (ya no se publica APK suelto).
name: Build AAB (Google Play)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Si el secreto no existe, el paso de subida a Play se omite
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PAQUETE: es.fernandezbadia.alarmacasa

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'

      - name: Find project root
        run: |
          PROJ=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -1 | xargs dirname)
          echo "Found project at: $PROJ"
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - name: Get app version
        run: |
          VERSION=$(grep '^version:' ${{ env.PROJECT_DIR }}/pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d ' ')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      # --org + --project-name forman el applicationId: es.fernandezbadia.alarmacasa
      - name: Generate Android structure
        run: |
          flutter create --project-name alarmacasa --org es.fernandezbadia /tmp/flutter_base
          cp -r /tmp/flutter_base/android ${{ env.PROJECT_DIR }}/

      - name: Patch AndroidManifest
        run: |
          python3 << 'PYEOF'
          import os
          proj = os.environ['PROJECT_DIR']
          path = f'{proj}/android/app/src/main/AndroidManifest.xml'

          with open(path, 'r') as f:
              txt = f.read()

          # 1. Etiqueta de la app y sin copias de seguridad en la nube (token y ajustes)
          assert 'android:label="alarmacasa"' in txt, 'plantilla de manifest inesperada'
          txt = txt.replace('android:label="alarmacasa"',
                            'android:label="Alarma Casa" android:allowBackup="false"')

          # 2. Solo el permiso de red; Play no admite instalar APK desde la app
          perms = '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          txt = txt.replace('<application', perms + '    <application', 1)

          # 3. Receivers de los widgets antes de </application>
          receivers = """    <receiver android:name=".AlarmWidget" android:exported="true">
                <intent-filter>
                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                </intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/alarm_widget_info"/>
              </receiver>
              <receiver android:name=".AlarmWidgetWide" android:exported="true">
                <intent-filter>
                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                </intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/alarm_widget_wide_info"/>
              </receiver>
          """
          assert '</application>' in txt
          txt = txt.replace('</application>', receivers + '  </application>')

          with open(path, 'w') as f:
              f.write(txt)

          print('Manifest patched successfully')
          PYEOF

      - name: Inject Firebase options
        env:
          FIREBASE_API_KEY:          ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID:           ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER: ${{ secrets.FIREBASE_MESSAGING_SENDER }}
          FIREBASE_PROJECT_ID:       ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:   ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          cat > ${{ env.PROJECT_DIR }}/lib/firebase_options.dart << EOF
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;

            static const FirebaseOptions android = FirebaseOptions(
              apiKey:            '$FIREBASE_API_KEY',
              appId:             '$FIREBASE_APP_ID',
              messagingSenderId: '$FIREBASE_MESSAGING_SENDER',
              projectId:         '$FIREBASE_PROJECT_ID',
              storageBucket:     '$FIREBASE_STORAGE_BUCKET',
            );
          }
          EOF

      - name: Setup Google Services JSON
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode \
            > ${{ env.PROJECT_DIR }}/android/app/google-services.json

      # Las contraseñas no se escriben en el fichero: Gradle las lee del entorno
      - name: Setup keystore and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ env.PROJECT_DIR }}/android/app/ha_alarm.jks
          cat >> ${{ env.PROJECT_DIR }}/android/app/build.gradle.kts << 'KTS'

          android {
              signingConfigs {
                  create("release_config") {
                      storeFile = file("ha_alarm.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release_config")
                  }
              }
          }
          KTS

      - name: Install widget resources
        run: |
          mkdir -p ${{ env.PROJECT_DIR }}/android/app/src/main/res/layout
          mkdir -p ${{ env.PROJECT_DIR }}/android/app/src/main/res/xml
          cp ${{ env.PROJECT_DIR }}/android_res/layout/alarm_widget.xml \
             ${{ env.PROJECT_DIR }}/android/app/src/main/res/layout/alarm_widget.xml
          cp ${{ env.PROJECT_DIR }}/android_res/layout/alarm_widget_wide.xml \
             ${{ env.PROJECT_DIR }}/android/app/src/main/res/layout/alarm_widget_wide.xml
          cp ${{ env.PROJECT_DIR }}/android_res/xml/alarm_widget_info.xml \
             ${{ env.PROJECT_DIR }}/android/app/src/main/res/xml/alarm_widget_info.xml
          cp ${{ env.PROJECT_DIR }}/android_res/xml/alarm_widget_wide_info.xml \
             ${{ env.PROJECT_DIR }}/android/app/src/main/res/xml/alarm_widget_wide_info.xml
          KOTLIN_DIR=${{ env.PROJECT_DIR }}/android/app/src/main/kotlin/es/fernandezbadia/alarmacasa
          mkdir -p $KOTLIN_DIR
          cp ${{ env.PROJECT_DIR }}/android_res/AlarmWidget.kt $KOTLIN_DIR/AlarmWidget.kt
          cp ${{ env.PROJECT_DIR }}/android_res/MainActivity.kt $KOTLIN_DIR/MainActivity.kt

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Generate launcher icons
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart run flutter_launcher_icons

      - name: Build AAB
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: alarma-casa-aab
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          files: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Requiere la primera subida manual en Play Console y el secreto PLAY_SERVICE_ACCOUNT_JSON
      - name: Subir a Google Play (prueba interna)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PAQUETE }}
          releaseFiles: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
