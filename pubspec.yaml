name: ha_alarm
description: Home Assistant Alarm Control
publish_to: none
version: 2026.11.12+52

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.4
  vibration: ^3.1.0
  intl: ^0.20.3
  file_picker: ^13.4.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
